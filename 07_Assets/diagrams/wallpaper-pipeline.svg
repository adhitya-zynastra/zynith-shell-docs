<svg xmlns="http://www.w3.org/2000/svg" width="720" height="484" viewBox="0 0 720 484" font-family="Inter,Segoe UI,DejaVu Sans,sans-serif"><rect width="720" height="484" fill="white"/><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#5b6070"/></marker></defs><rect x="30" y="16" width="660" height="50" rx="7" fill="#f5f7fb" stroke="#c8ccd6"/><text x="360.0" y="38.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1b1f">WallpaperScanner</text><text x="360.0" y="54.0" text-anchor="middle" font-size="10" fill="#5b6070">background walk · dir-mtime cache</text><line x1="360" y1="66" x2="360" y2="82" stroke="#5b6070" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="82" width="660" height="50" rx="7" fill="#f5f7fb" stroke="#c8ccd6"/><text x="360.0" y="104.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1b1f">beginSession()</text><text x="360.0" y="120.0" text-anchor="middle" font-size="10" fill="#5b6070">idle budget raised · entries tagged</text><line x1="360" y1="132" x2="360" y2="148" stroke="#5b6070" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="148" width="660" height="50" rx="7" fill="#e7edff" stroke="#4c6ef5"/><text x="360.0" y="170.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1b1f">prefetch whole collection @384 px</text><text x="360.0" y="186.0" text-anchor="middle" font-size="10" fill="#5b6070">preview tier — instant browsing</text><line x1="360" y1="198" x2="360" y2="214" stroke="#5b6070" stroke-width="1.6" marker-end="url(#a)"/><rect x="30" y="214" width="660" height="50" rx="7" fill="#e7edff" stroke="#4c6ef5"/><text x="360.0" y="236.0" text-anchor="middle" font-size="13" font-weight="600" fill="#1b1b1f">promotion window  focus−1 … focus+3</text><text x="360.0" y="252.0" text-anchor="middle" font-size="10" fill="#5b6070">display tier @768 px · leans with travel</text><line x1="360" y1="264" x2="360" y